name: Enable Auto-Merge for Existing PRs

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-automerge:
    runs-on: ubuntu-latest

    steps:
      - name: Enable auto-merge for all open PRs to main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh pr list \
            --repo "$REPO" \
            --base main \
            --state open \
            --limit 100 \
            --json number \
            --jq '.[].number' |
          while read -r PR; do
            echo "Enabling auto-merge for PR #$PR"

            gh pr merge "$PR" \
              --repo "$REPO" \
              --squash \
              --auto
          done
