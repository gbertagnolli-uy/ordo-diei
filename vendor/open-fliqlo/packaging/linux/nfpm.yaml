# nFPM config for Open Fliqlo Linux packages (DEB + RPM).
# Invoked by packaging/linux/package.sh with STAGE substituted to absolute paths.
#
# App + helpers go under /usr/lib/open-fliqlo. The GNOME extension payload is
# shipped under /usr/share/open-fliqlo/gnome-extension/ and postinstall copies
# it into the installing user's ~/.local/.../extensions/ (User Extensions).

name: open-fliqlo
arch: amd64
platform: linux
version: ${VERSION}
release: "1"
section: utils
priority: optional
maintainer: Open Fliqlo <openfliqlo@users.noreply.github.com>
description: |
  Fullscreen flip clock for Linux desktop and GNOME lock screen.
  Includes the Open Fliqlo app; the GNOME lock-screen extension is installed
  into the packaging user's home as a User Extension.
vendor: Open Fliqlo
homepage: https://github.com/openfliqlo/open-fliqlo
license: MIT

depends:
  - libgtk-3-0 | libgtk-3-0t64
  - libgstreamer1.0-0 | libgstreamer1.0-0t64
  - libgstreamer-plugins-base1.0-0 | libgstreamer-plugins-base1.0-0t64

contents:
  - src: ${STAGE}/usr/lib/open-fliqlo/
    dst: /usr/lib/open-fliqlo/
    type: tree

  - src: /usr/lib/open-fliqlo/fliqlo
    dst: /usr/bin/fliqlo
    type: symlink

  - src: ${STAGE}/usr/share/applications/open-fliqlo.desktop
    dst: /usr/share/applications/open-fliqlo.desktop
    file_info:
      mode: 0644

  - src: ${STAGE}/usr/share/applications/open-fliqlo-screensaver.desktop
    dst: /usr/share/applications/open-fliqlo-screensaver.desktop
    file_info:
      mode: 0644

  - src: ${STAGE}/usr/share/open-fliqlo/gnome-extension/
    dst: /usr/share/open-fliqlo/gnome-extension/
    type: tree

scripts:
  postinstall: ./packaging/linux/postinstall.sh
  postremove: ./packaging/linux/postremove.sh

overrides:
  rpm:
    depends:
      - gtk3
      - gstreamer1
      - gstreamer1-plugins-base
